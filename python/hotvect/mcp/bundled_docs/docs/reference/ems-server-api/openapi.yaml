      properties:
        algorithms:
          type: array
          items:
            $ref: "#/components/schemas/AlgorithmsWithVariantsDTO"
    AlgorithmsWithVariantsDTO:
      type: object
      properties:
        algorithmName:
          type: string
        algorithmVersion:
          type: string
        state:
          type: string
        absoluteS3JarPath:
