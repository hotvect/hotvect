    VariantBasicDetails:
      type: object
      properties:
        variant_id:
          type: integer
          format: int32
        algorithm:
          $ref: "#/components/schemas/Algorithm"
        is_default:
          type: boolean
        is_control:
          type: boolean
        shard_allocation_ratio:
          type: integer
          format: int32
    ExperimentRampUpLog:
      type: object
      properties:
        experiment_ramp_up_log_id:
          type: integer
          format: int32
        experiment:
          $ref: "#/components/schemas/Experiment"
        terminated_at:
          type: string
          format: date-time
        ramp_up_percentage:
          type: integer
